<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obras Finalistas - NARTERIIN FEST 2026</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1325;
            color: #ffffff;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            color: #d4af37;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 50px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .video-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #d4af37;
            border-radius: 15px;
            overflow: hidden;
            text-align: left;
        }
        .video-thumbnail {
            width: 100%;
            height: 200px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            border-bottom: 2px solid #d4af37;
        }
        .video-info {
            padding: 20px;
        }
        .categoria {
            display: inline-block;
            background: #d4af37;
            color: #0b1325;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .video-info h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #ffffff;
        }
        .video-info p {
            margin: 0 0 20px 0;
            font-size: 0.9rem;
            color: #cccccc;
        }
        .card-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 8px;
        }
        .btn-ver {
            background-color: #d4af37;
            color: #0b1325;
        }
        .btn-votar {
            background-color: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
        }
        .btn-volver {
            display: inline-block;
            margin-top: 50px;
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #d4af37;
            padding: 10px 25px;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Obras Finalistas NARTERIIN FEST 2026</h1>
        <p class="subtitle">Explora las narrativas territoriales de nuestros semilleros.</p>
        <div class="video-grid">
            <div class="video-card">
                <div class="video-thumbnail">[Miniatura]</div>
                <div class="video-info">
                    <span class="categoria">Categoría B</span>
                    <h3>Nombre del Proyecto</h3>
                    <p>Equipo: Integrantes</p>
                    <div class="card-actions">
                        <a href="#" class="btn btn-ver">Ver Video</a>
                        <a href="#" class="btn btn-votar">Votar</a>
                    </div>
                </div>
            </div>
        </div>
        <a href="index.html" class="btn-volver">Volver al Inicio</a>
    </div>
</body>
</html>
