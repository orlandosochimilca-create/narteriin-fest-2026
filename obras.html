        }

        }
        .video-info {

        }

            margin-bottom: 10px;

            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #ffffff;
        }
        .video-info p {

            color: #cccccc;
        }
        .card-actions {
            display: flex;
            gap: 10px;
